name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  commitlint:
    name: Commit Messages
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate commit messages
        run: npx commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }} --verbose

  quality:
    name: Code Quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit dependencies
        # Blocking gate: fail the build on moderate-or-higher advisories in
        # production dependencies. Known low-severity advisories that have no
        # compatible patch are documented in pnpm-workspace.yaml `overrides`.
        run: pnpm audit --prod --audit-level=moderate

      - name: Type check
        run: pnpm run check-types

      - name: Layer-boundary gate
        # Enforces the dependency layering (acyclic + strictly downward) from the
        # declared workspace deps. See scripts/check-layers.mjs and CONTRIBUTING §6.
        run: pnpm run check:layers

      - name: Script tests
        # Repo-tooling tests (scripts/*.test.mjs), incl. the layer-gate regression
        # tests — these don't run under the turbo `test` task.
        run: pnpm run test:scripts

      - name: Authoring WASM artifact integrity
        # The committed osc-engine.wasm is the one file a reviewer cannot read in
        # a diff — verify it matches its sha256 manifest (written by build:wasm)
        # so a corrupted/tampered blob fails loudly. Cheap: no build, pure node.
        run: node packages/authoring-wasm/native/verify-checksum.mjs

      - name: Lint
        run: pnpm run lint

      - name: Format check
        run: pnpm run format:check

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify the pinned ontology is materialized
        # postinstall fetches it advisory-only, so a network hiccup would show up
        # as confusing empty-result test failures. Name the cause instead.
        run: pnpm run check:setup

      - name: Run tests
        run: pnpm run test

      # Enforced per-package coverage floors on the pure, fast, instrumentation-
      # safe units (slots, graphql-ir). The oxigraph cold-start packages are
      # deliberately excluded — they are guarded by behavior tests, and coverage
      # instrumentation worsens their documented cold-start timeout (ADR 0003
      # step 5). Floors live in each package's vitest.config.ts; ratchet up.
      - name: Check coverage floors
        run: pnpm run coverage

  first-run:
    name: First run (clean machine)
    runs-on: ubuntu-latest
    steps:
      # No submodules on purpose: a developer cloning to try the search does
      # not need the authoring engine's build inputs, and the ontology comes
      # from the pinned package.
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install exactly as a new developer does
        run: pnpm install --frozen-lockfile

      # The setup gate must pass on a machine that has not been configured yet.
      # It failed here once: a missing .env.local was treated as a broken
      # machine, so the very first command a new developer runs said no.
      - name: The setup gate passes on an unconfigured machine
        run: |
          test ! -f .env.local
          pnpm run check:setup

      - name: Build
        run: pnpm run build

      # The end-to-end first-run contract: a server that starts with no
      # configuration, reports ready, names what is unavailable, keeps serving
      # the routes that do not need it, and answers a search with the command
      # that fixes it rather than "Search failed".
      - name: A clean machine starts and explains itself
        run: node scripts/first-run-smoke.mjs --require-clean

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [quality, test]
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build

  e2e:
    name: E2E (smoke)
    runs-on: ubuntu-latest
    needs: [quality, test]
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The API/web dev servers import workspace packages through their built
      # `dist` (package `exports`), so the libraries must be built first. The
      # unit-test job gets this via turbo's `test` → `^build` dependency, but
      # this job runs Playwright directly, so build explicitly.
      - name: Verify the pinned ontology is materialized
        run: pnpm run check:setup

      - name: Build workspace
        run: pnpm run build

      # The API dev server loads `.env.local` when present. The committed
      # example defaults to the keyless `ollama` provider and in-memory store,
      # which is all the smoke needs — the search-flow specs mock the LLM, so
      # no provider is ever actually called. No Ollama runs here, so warmup
      # records the provider as an unavailable-but-non-fatal warning and the
      # API still reports ready.
      - name: Seed env
        run: cp .env.example .env.local

      - name: Install Playwright browser
        run: pnpm --filter @ontology-search/e2e exec playwright install --with-deps chromium

      # Playwright's webServer config boots the real API + web and waits for
      # /health; the smoke spec then asserts the live store is populated.
      - name: Run E2E tests
        run: pnpm --filter @ontology-search/e2e test:e2e
