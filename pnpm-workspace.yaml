packages:
  - 'apps/*'
  - 'packages/*'

# Fail the install when the running Node does not satisfy `engines.node`
# instead of printing a warning nobody reads. A too-old Node installs fine
# without this and then fails later in unrelated-looking ways (a missing
# built-in, an unsupported flag), which is far harder to diagnose than
# "Expected version: >=22.19.0, Got: v20.x" at install time.
#
# This setting MUST live here, not in `.npmrc`: pnpm 11 reads its own settings
# from this file, and silently ignores them in `.npmrc`.
engineStrict: true
allowBuilds:
  '@swc/core': true
  esbuild: true
minimumReleaseAgeExclude:
  # Security fix adopted ahead of the release-age hold: 4.12.34 patches the
  # CORS-middleware ReDoS (GHSA-8j4g-w8fx-2239, moderate). Waiting out the hold
  # would leave the API server on a vulnerable release.
  - hono@4.12.34
  - '@ai-sdk/anthropic@4.0.24'
  - '@ai-sdk/gateway@4.0.32'
  - '@ai-sdk/mistral@4.0.17'
  - '@ai-sdk/openai@4.0.24'
  - '@ai-sdk/provider-utils@5.0.15'
  - ai@7.0.42
overrides:
  # Security advisories GHSA-mh99-v99m-4gvg and GHSA-rgw5-rvv9-x895
  # (brace-expansion DoS via unbounded intermediate arrays, high). The second
  # bypasses the CVE-2026-14257 mitigation that 5.0.8 shipped, so the floor is
  # >=5.0.9. The 5.x CJS build exports a NAMED `expand` (not the legacy bare
  # function), so only minimatch >=10 consumes it correctly; older transitive
  # minimatch (3.x via @eslint/config-array, 9.x via typescript-estree) crash on
  # it (`TypeError: expand is not a function`). We therefore lift the whole
  # minimatch lineage to 10.x (which depends on brace-expansion@^5) and floor
  # brace-expansion at the patched 5.0.9. minimatch is dev-tooling only (ESLint /
  # typescript-eslint — no runtime consumer). Verified: lint + typecheck + tests pass.
  minimatch: ^10.2.5
  brace-expansion: ^5.0.9
  # Two quadratic-CPU advisories against the same 4.x line, so the floor is the
  # higher of the two patched versions:
  #   GHSA-52cp-r559-cp3m — merge-key chains, patched in 4.3.0
  #   GHSA-5p4m-2wfm-xmqj — !!omap resolution (CVE-2026-59870), patched in 4.3.1
  # The `^4.3.0` floor still resolved to a version the second advisory covers.
  # Reached under `--audit-level=moderate --prod` via eslint-config's
  # typescript-eslint → eslint → @eslint/eslintrc; dev-tooling only, no runtime
  # consumer, but it fails the audit gate on every PR until floored.
  js-yaml@4: ^4.3.1
  #
  # NOT overridden: @ai-sdk/provider-utils (GHSA-866g-f22w-33x8, LOW).
  # The only stable patched line is 4.x, but `ai`@5 / @ai-sdk@2 require
  # provider-utils@3 — forcing 4.x breaks `import { tool } from 'ai'`.
  # Accepted until a coordinated ai/@ai-sdk major bump. CI gates at
  # `--audit-level=moderate`, so this low advisory does not block release.
