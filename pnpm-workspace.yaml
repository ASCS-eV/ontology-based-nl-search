packages:
  - 'apps/*'
  - 'packages/*'

# Fail the install when the running Node does not satisfy `engines.node`
# instead of printing a warning nobody reads. A too-old Node installs fine
# without this and then fails later in unrelated-looking ways (a missing
# built-in, an unsupported flag), which is far harder to diagnose than
# "Expected version: >=22.19.0, Got: v20.x" at install time.
#
# This setting MUST live here, not in `.npmrc`: pnpm 11 reads its own settings
# from this file, and silently ignores them in `.npmrc`.
engineStrict: true
# Make every `pnpm install` check `node_modules` against the lockfile, so it
# recreates a workspace link that has gone missing. The default fast check
# compares only the manifests, the lockfile and the patch files, so it reports
# "Already up to date" over a missing link, and the build then fails with
# TS2307 "Cannot find module '@ontology-search/…'". A repeat install on an
# intact tree takes about a tenth of a second longer.
# https://pnpm.io/settings/other#optimisticrepeatinstall
optimisticRepeatInstall: false
allowBuilds:
  '@swc/core': true
  esbuild: true
  koffi: false
minimumReleaseAgeExclude:
  # Security fix adopted ahead of the release-age hold: 4.12.34 patches the
  # CORS-middleware ReDoS (GHSA-8j4g-w8fx-2239, moderate). Waiting out the hold
  # would leave the API server on a vulnerable release.
  - hono@4.12.34
  - '@ai-sdk/anthropic@4.0.24'
  - '@ai-sdk/gateway@4.0.32'
  - '@ai-sdk/mistral@4.0.17'
  - '@ai-sdk/openai@4.0.24'
  - '@ai-sdk/provider-utils@5.0.15'
  - ai@7.0.42
overrides:
  # Security advisories GHSA-mh99-v99m-4gvg and GHSA-rgw5-rvv9-x895
  # (brace-expansion DoS via unbounded intermediate arrays, high). The second
  # bypasses the CVE-2026-14257 mitigation that 5.0.8 shipped, so the floor was
  # >=5.0.9; three further advisories raise it to the highest patched version:
  #   GHSA-6j4f-fj2g-mc7p — recursion in parseCommaParts (high), patched in 5.0.10
  #   GHSA-qhr7-859c-m2p7 — recursion on nested brace groups (high), patched in 5.0.11
  #   GHSA-q2hr-2g5m-vwhr — quadratic `{a},b}` rewrite (moderate), patched in 5.0.12
  # The 5.x CJS build exports a NAMED `expand` (not the legacy bare
  # function), so only minimatch >=10 consumes it correctly; older transitive
  # minimatch (3.x via @eslint/config-array, 9.x via typescript-estree) crash on
  # it (`TypeError: expand is not a function`). We therefore lift the whole
  # minimatch lineage to 10.x (which depends on brace-expansion@^5) and floor
  # brace-expansion at the patched 5.0.12. minimatch is dev-tooling only (ESLint /
  # typescript-eslint — no runtime consumer). Verified: lint + typecheck + tests pass.
  minimatch: ^10.2.5
  brace-expansion: ^5.0.12
  # Two quadratic-CPU advisories against the same 4.x line, so the floor is the
  # higher of the two patched versions:
  #   GHSA-52cp-r559-cp3m — merge-key chains, patched in 4.3.0
  #   GHSA-5p4m-2wfm-xmqj — !!omap resolution (CVE-2026-59870), patched in 4.3.1
  # The `^4.3.0` floor still resolved to a version the second advisory covers.
  # Reached under `--audit-level=moderate --prod` via eslint-config's
  # typescript-eslint → eslint → @eslint/eslintrc; dev-tooling only, no runtime
  # consumer, but it fails the audit gate on every PR until floored.
  # Four undici advisories; the floor is the highest patched version per line:
  #   GHSA-3wwx-pv8p-q78v — unhandled error in WebSocket permessage-deflate
  #                         decompression (moderate), patched in 7.29.1 and 8.10.2
  #   GHSA-xjj6-f33q-929c — unhandled error on excessive content-encodings
  #                         (high), patched in 7.30.1 and 8.12.2
  #   GHSA-4qv8-2p9j-2685 — unbounded memory in the EventSource parser
  #                         (moderate), patched in 7.30.1 and 8.12.2
  #   GHSA-f72v-6w45-q472 — Subresource Integrity bypass via non-lowercase
  #                         algorithm tokens (moderate), patched in 7.30.1 and 8.12.2
  # The direct dependencies are floored at ^8.12.2; the 7.x line arrives through
  # @ai-sdk/provider-utils (`^7.28.0`), so floor it here.
  undici@>=7.0.0 <7.30.1: ^7.30.1
  '@babel/core@<=7.29.0': ^7.29.6
  baseline-browser-mapping@>=2.0.0 <2.11.0: ^2.11.0
  browserslist@<=4.28.6: ^4.28.7
  dompurify@<3.4.7: ^3.4.7
  dompurify@<3.4.9: ^3.4.9
  dompurify@<=3.4.10: ^3.4.11
  dompurify@<=3.4.11: ^3.4.12
  dompurify@<=3.4.12: ^3.4.13
  dompurify@<=3.4.5: ^3.4.6
  dompurify@<=3.4.6: ^3.4.7
  dompurify@>=3.0.0 <=3.4.7: ^3.4.8
  esbuild@<=0.24.2: ^0.25.0
  esbuild@>=0.27.3 <0.28.1: ^0.28.1
  fast-uri@>=3.0.0 <3.1.3: ^3.1.3
  fast-uri@>=3.0.0 <3.1.5: ^3.1.5
  fast-uri@>=3.0.0 <3.1.6: ^3.1.6
  fast-uri@>=3.0.0 <=3.1.3: ^3.1.4
  fast-uri@>=3.1.2 <3.1.6: ^3.1.6
  hono@<4.13.5: ^4.13.5
  js-yaml@>=4.0.0 <4.3.2: ^4.3.2
  mermaid@>=11.0.0-alpha.1 <11.16.1: ^11.16.1
  mermaid@>=11.0.0-alpha.1 <=11.14.0: ^11.15.0
  mermaid@>=11.5.0 <11.16.1: ^11.16.1
  mermaid@>=11.6.0 <11.16.1: ^11.16.1
  nanoid@<3.3.16: ^3.3.16
  nanoid@<3.3.18: ^3.3.18
  postcss@<=8.5.17: ^8.5.18
  postcss@<=8.5.22: ^8.5.23
  # Two advisories in the seroval line that @tanstack/router-core (the web app's
  # router) serializes route state with, both reachable through `fromJSON()`:
  #   GHSA-p6vx-979v-rg4c — Promise thenable assimilation invokes plugin-produced
  #                         callables, a bypass of GHSA-mv8w-475r-vwqw (critical),
  #                         patched in 1.6.1
  #   GHSA-jp82-f5mq-hwhp — memory exhaustion via an unchecked TypedArray length
  #                         (high), patched in 1.6.3
  # The floor is the higher of the two. Reached under `--prod --audit-level=moderate`
  # through apps/web → @tanstack/react-router → @tanstack/router-core.
  seroval@<1.6.3: ^1.6.3
  tar@<=7.5.20: ^7.5.21
  vite@<=6.4.2: ^6.4.3
  ws@>=8.0.0 <8.20.1: ^8.20.1
  ws@>=8.0.0 <8.21.0: ^8.21.0
  #
  # NOT overridden: @ai-sdk/provider-utils (GHSA-866g-f22w-33x8, LOW).
  # The only stable patched line is 4.x, but `ai`@5 / @ai-sdk@2 require
  # provider-utils@3 — forcing 4.x breaks `import { tool } from 'ai'`.
  # Accepted until a coordinated ai/@ai-sdk major bump. CI gates at
  # `--audit-level=moderate`, so this low advisory does not block release.
