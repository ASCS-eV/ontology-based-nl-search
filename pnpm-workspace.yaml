packages:
  - 'apps/*'
  - 'packages/*'
allowBuilds:
  '@swc/core': true
  esbuild: true
minimumReleaseAgeExclude:
  - '@ai-sdk/anthropic@4.0.24'
  - '@ai-sdk/gateway@4.0.32'
  - '@ai-sdk/mistral@4.0.17'
  - '@ai-sdk/openai@4.0.24'
  - '@ai-sdk/provider-utils@5.0.15'
  - ai@7.0.42
overrides:
  # Security advisory GHSA-mh99-v99m-4gvg (brace-expansion DoS, high). The fix is
  # brace-expansion >=5.0.8, whose CJS build exports a NAMED `expand` (not the
  # legacy bare function), so only minimatch >=10 consumes it correctly; older
  # transitive minimatch (3.x via @eslint/config-array, 9.x via typescript-estree)
  # crash on it (`TypeError: expand is not a function`). We therefore lift the whole
  # minimatch lineage to 10.x (which depends on brace-expansion@^5) and pin
  # brace-expansion to the patched 5.0.8. minimatch is dev-tooling only (ESLint /
  # typescript-eslint — no runtime consumer). Verified: lint + typecheck + tests pass.
  minimatch: ^10.2.5
  brace-expansion: ^5.0.8
  js-yaml@4: ^4.3.0 # quadratic DoS in merge-key chains (GHSA-52cp-r559-cp3m), high
  #
  # NOT overridden: @ai-sdk/provider-utils (GHSA-866g-f22w-33x8, LOW).
  # The only stable patched line is 4.x, but `ai`@5 / @ai-sdk@2 require
  # provider-utils@3 — forcing 4.x breaks `import { tool } from 'ai'`.
  # Accepted until a coordinated ai/@ai-sdk major bump. CI gates at
  # `--audit-level=moderate`, so this low advisory does not block release.
